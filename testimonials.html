    <style>
        :root {
            --color-purple: #6450BB;
            --override-accent-color: #655dc6;
            --color-text: #000;
            --font-regular: 'Inter', sans-serif;
            --font-bold: 'Inter', sans-serif;
            --header-height: 96px;
            --gutter: 30px;
        }

        body {
            margin: 0;
            font-family: var(--font-regular);
            color: var(--color-text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: linear-gradient(180deg, #ffffff, #e8e4f5, #beb4e6, #e8e4f5, #ffffff);
            background-size: 100% 400%;
            animation: ombreUpDown 12s ease-in-out infinite;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            height: var(--header-height);
            border-bottom: 1px solid #eee;
            position: relative;
            padding: 0 60px;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(10px);
            z-index: 1001;
        }

        .logo {
            position: absolute;
            left: var(--gutter);
            font-family: var(--font-bold);
            font-weight: 700;
            font-size: 28px;
            text-transform: uppercase;
        }

        .logo a { text-decoration: none; color: inherit; }

        /* Menu logic remains unchanged */
        .menu-toggle { display: flex; flex-direction: column; gap: 6px; cursor: pointer; z-index: 1100; position: absolute; right: var(--gutter); }
        .menu-toggle span { width: 30px; height: 3px; background: var(--color-text); transition: 0.3s; }
        .nav-menu { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: white; display: flex; list-style: none; flex-direction: column; justify-content: center; align-items: center; gap: 20px; margin: 0; padding: 0; transform: translateX(100%); transition: transform 0.4s ease; z-index: 1050; }
        .nav-menu.active { transform: translateX(0); }
        .nav-link { text-decoration: none; color: var(--color-text); font-family: var(--font-bold); font-size: 22px; text-transform: uppercase; }

        .hero { height: 30vh; display: flex; align-items: center; padding: 0 var(--gutter); }
        .hero-content h1 { font-family: var(--font-bold); font-size: 48px; margin: 0; }

        /* FIXED FILM STRIP CSS */
        .film-strip-outer {
            width: 100%;
            overflow: hidden;
            padding: 50px 0;
            position: relative;
        }

        .film-strip-track {
            display: flex;
            width: max-content; /* Critical: Fits content perfectly */
            will-change: transform;
            /* Animation set via JS to handle dynamic width */
        }

        @keyframes scroll {
            from { transform: translate3d(0, 0, 0); }
            to { transform: translate3d(var(--scroll-dist), 0, 0); }
        }

        .testimonial-card {
            flex: 0 0 350px;
            margin: 0 15px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.4);
            padding: 30px;
            height: 350px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            white-space: normal;
        }

        /* Modal Styles - Untouched */
        #testimonial-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); backdrop-filter: blur(15px); z-index: 2000; justify-content: center; align-items: center; }
        .modal-content { width: 90%; max-width: 800px; max-height: 80vh; background: #fff; padding: 60px; overflow-y: auto; position: relative; box-shadow: 0 50px 100px rgba(0,0,0,0.1); }
        .close-btn { position: fixed; top: 40px; right: 40px; font-size: 50px; cursor: pointer; }
        .nav-btn { position: fixed; top: 50%; transform: translateY(-50%); font-size: 40px; cursor: pointer; color: var(--override-accent-color); padding: 20px; }
        .prev-btn { left: 20px; } .next-btn { right: 20px; }

        @keyframes ombreUpDown { 0% { background-position: 50% 0%; } 50% { background-position: 50% 100%; } 100% { background-position: 50% 0%; } }
        footer { padding: 40px; text-align: center; border-top: 1px solid #eee; margin-top: auto; }
        .copyright { font-size: 13px; color: #888; text-transform: uppercase; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo"><a href="index.html">MATHSCIONLINE</a></div>
        <div class="menu-toggle" id="mobile-menu"><span></span><span></span><span></span></div>
        <ul class="nav-menu">

            </ul>
    </nav>

    <section class="hero">
        <div class="hero-content"><h1>Student Success <br>& Testimonials.</h1></div>
    </section>

    <div class="film-strip-outer">
        <div class="film-strip-track" id="strip-track"></div>
    </div>

    <div id="testimonial-modal">
        <div class="close-btn" onclick="closeModal()">&times;</div>
        <div class="nav-btn prev-btn" onclick="changeTst(-1)">&#10229;</div>
        <div class="modal-content"><div id="modal-body"></div></div>
        <div class="nav-btn next-btn" onclick="changeTst(1)">&#10230;</div>
    </div>

    <footer><div class="copyright">&copy; 2026- Present MATHSCIONLINE.</div></footer>

    <script>
        const quotes = [
            { name: "Benjamin Leman", date: "05/08/2025", title: "Excellent!", text: "This class will definitely prepare you for the AP exam. Mrs. Heapy is an excellent teacher..." },
            { name: "Cate Wells", date: "05/05/2025", title: "Recommend!", text: "This class was a lot of fun, and I learned a lot over the course of the year..." },
            { name: "Esther Wu", date: "10/05/2024", title: "Success!", text: "I took AP Biology with Mrs. Heapy and it was my favorite course so far..." },
            { name: "Erin McDonald", date: "05/21/2022", title: "Amazing!", text: "Engaging labs and organized lessons. Mrs. Heapy is extremely understanding..." }
        ];

        const track = document.getElementById('strip-track');

        function initStrip() {
            // 1. Create one full set of cards
            quotes.forEach((q, i) => {
                const card = document.createElement('div');
                card.className = 'testimonial-card';
                card.onclick = () => openModal(i);
                card.innerHTML = `<div class="card-snippet">"${q.text}"</div><div><div class="card-author">${q.name}</div></div>`;
                track.appendChild(card);
            });

            // 2. Clone the set immediately for the seamless loop
            const clone = track.innerHTML;
            track.innerHTML += clone;

            // 3. Calculate exact width to prevent the "jump"
            const totalWidth = track.scrollWidth;
            const scrollDistance = totalWidth / 2;

            // 4. Inject the exact pixel distance into CSS
            track.style.setProperty('--scroll-dist', `-${scrollDistance}px`);
            track.style.animation = "scroll 40s linear infinite";
        }

        window.onload = initStrip;

        function openModal(idx) {
            const q = quotes[idx];
            document.getElementById('modal-body').innerHTML = `<h2>${q.title}</h2><p>${q.name}</p><hr><p>${q.text}</p>`;
            document.getElementById('testimonial-modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('testimonial-modal').style.display = 'none'; }

        // Mobile menu toggle
        document.getElementById('mobile-menu').onclick = () => {
            document.querySelector('.nav-menu').classList.toggle('active');
        };
    </script>
